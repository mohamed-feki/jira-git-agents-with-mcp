spring:
  ai:
    openai:
      base-url: https://ollama.com
      api-key: ${OLLAMA_API_TOKEN:}
      chat:
        options:
          model: gemma4:31b-cloud

    mcp:
      client:
        enabled: true
        initialized-clients: sync    # ensure clients are eagerly initialized
        servers:
          jira:
            transport: STDIO
            command: uvx
            args:
              - mcp-atlassian
            env:
              JIRA_URL: ${JIRA_URL:https://mohamedfeki.atlassian.net}              # e.g. https://yourorg.atlassian.net
              JIRA_USERNAME: ${JIRA_USERNAME:medfeki04@gmail.com}    # your Atlassian account email
              JIRA_API_TOKEN: ${JIRA_API_TOKEN:}  # API token from id.atlassian.com

server:
  port: 8081

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
